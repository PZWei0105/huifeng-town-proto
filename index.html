<script>
'use strict';
// ================== 基本設定 ==================
const W=960,H=540,FLOOR=440;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const FONT='"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif';
const SERIF='"Noto Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU",serif';
function fit(){const vw=(window.visualViewport&&visualViewport.width)||innerWidth,vh=(window.visualViewport&&visualViewport.height)||innerHeight;const s=Math.min(vw/W,vh/H);cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,250));if(window.visualViewport)visualViewport.addEventListener('resize',fit);fit();
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function rng(seed){seed=(Math.floor(seed)%2147483646)+1;return ()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

// ================== 音效（WebAudio 程序生成） ==================
const AU={ctx:null,master:null,noise:null};
function audioInit(){
  if(AU.ctx){if(AU.ctx.state!=='running'){try{AU.ctx.resume();const sb=AU.ctx.createBufferSource();sb.buffer=AU.ctx.createBuffer(1,1,22050);sb.connect(AU.ctx.destination);sb.start(0);}catch(e){}}return;}
  const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
  try{
  const a=new A();AU.ctx=a;const m=a.createGain();m.gain.value=0.6;m.connect(a.destination);AU.master=m;
  const len=a.sampleRate*2,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noise=b;
  // 低沉嗡鳴
  const dg=a.createGain();dg.gain.value=0.05;dg.connect(m);
  [55,55.35,82.4].forEach(f=>{const o=a.createOscillator();o.type='sawtooth';o.frequency.value=f;const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=170;o.connect(lp);lp.connect(dg);o.start();});
  const lfo=a.createOscillator();lfo.frequency.value=0.07;const lgn=a.createGain();lgn.gain.value=0.03;lfo.connect(lgn);lgn.connect(dg.gain);lfo.start();
  // 風聲
  const n=a.createBufferSource();n.buffer=b;n.loop=true;const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=0.8;
  const wg=a.createGain();wg.gain.value=0.035;n.connect(bp);bp.connect(wg);wg.connect(m);n.start();
  const l2=a.createOscillator();l2.frequency.value=0.11;const l2g=a.createGain();l2g.gain.value=260;l2.connect(l2g);l2g.connect(bp.frequency);l2.start();
  }catch(e){AU.ctx=null;}
}
function noiseBurst(dur,freq,q,vol,type,delay){const a=AU.ctx;if(!a||!AU.noise)return;const t=a.currentTime+(delay||0);
  const s=a.createBufferSource();s.buffer=AU.noise;const f=a.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq;f.Q.value=q;
  const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(g);g.connect(AU.master);s.start(t,Math.random());s.stop(t+dur+0.05);}
function tone(freq,dur,type,vol,slideTo,delay){const a=AU.ctx;if(!a)return;const t=a.currentTime+(delay||0);
  const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(freq,t);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  const g=a.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+dur+0.05);}
const SFX={
  shot(){noiseBurst(0.35,2600,0.5,0.9);tone(150,0.25,'sine',0.8,40);noiseBurst(1.4,500,0.3,0.18,'lowpass',0.05);},
  empty(){tone(900,0.04,'square',0.12);},
  reload(){noiseBurst(0.06,3000,2,0.25,'bandpass');noiseBurst(0.08,2000,2,0.3,'bandpass',0.8);noiseBurst(0.06,3500,3,0.35,'bandpass',1.55);},
  step(){noiseBurst(0.08,260+Math.random()*200,1,0.13,'lowpass');},
  pick(){tone(660,0.1,'triangle',0.15);tone(990,0.14,'triangle',0.12,null,0.08);},
  door(){tone(230,0.7,'sawtooth',0.04,150);noiseBurst(0.5,500,4,0.18,'bandpass');},
  locked(){noiseBurst(0.08,1200,5,0.35,'bandpass');noiseBurst(0.08,1000,5,0.35,'bandpass',0.13);},
  groan(){tone(85+Math.random()*30,1.1,'sawtooth',0.07,55);tone(120+Math.random()*20,0.9,'square',0.02,70,0.1);},
  hurt(){tone(200,0.3,'square',0.15,80);noiseBurst(0.25,800,1,0.35);},
  hit(){noiseBurst(0.15,700,1,0.4);tone(70,0.3,'sine',0.3,40);},
  beep(){tone(1200,0.06,'square',0.08);},
  bad(){tone(180,0.3,'square',0.1,120);},
  unlock(){tone(523,0.12,'triangle',0.15);tone(784,0.25,'triangle',0.15,null,0.1);noiseBurst(0.1,2500,3,0.3,'bandpass',0.05);},
  heal(){tone(440,0.2,'sine',0.12,660);},
  sting(){tone(110,2.8,'sawtooth',0.1,52);tone(116.5,2.8,'sawtooth',0.08,55);noiseBurst(2,300,1,0.2);},
  bell(){[0,1.6].forEach(d=>{tone(196,3,'sine',0.25,190,d);tone(392*1.01,2,'sine',0.08,null,d);tone(587,1.5,'sine',0.05,null,d);});},
  melody(){const N=[392,440,466,440,392,349,392,0,349,392,440,392,349,311,293];N.forEach((f,i)=>{if(f){tone(f,0.5,'triangle',0.09,null,i*0.32);tone(f/2,0.6,'sine',0.05,null,i*0.32);}});noiseBurst(5,3000,0.5,0.03,'highpass');}
};

// ================== 輸入 ==================
const keys={},pressed={},mouse={x:W/2,y:H/2};
let touchMode=!!(window.matchMedia&&matchMedia('(pointer: coarse)').matches);
const TX=(k,t)=>touchMode?t:k;
const BLOCK=['Tab','Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Backspace'];
addEventListener('keydown',e=>{audioInit();touchMode=false;if(BLOCK.includes(e.code))e.preventDefault();if(!keys[e.code])pressed[e.code]=true;keys[e.code]=true;});
addEventListener('keyup',e=>{keys[e.code]=false;});
// ---- 觸控按鈕（畫布座標） ----
const TBTN=[{id:'T_left',x:88,y:450,r:62},{id:'T_right',x:230,y:450,r:62},
  {id:'T_fire',x:870,y:446,r:66,label:'開槍'},{id:'T_aim',x:738,y:474,r:52,label:'瞄準'},
  {id:'T_reload',x:750,y:352,r:44,label:'裝填'},{id:'T_use',x:876,y:316,r:50,label:'調查'}];
const TRECT=[{id:'T_inv',x:W-156,y:12,w:68,h:44,label:'背包'},{id:'T_fs',x:W-80,y:12,w:66,h:44,label:'全螢幕'}];
const FS_EL=document.documentElement;
const fsSupported=!!(FS_EL.requestFullscreen||FS_EL.webkitRequestFullscreen);
function inRect(p,b){return p.x>=b.x-8&&p.x<=b.x+b.w+8&&p.y>=b.y-8&&p.y<=b.y+b.h+8;}
function fsShown(){return touchMode&&fsSupported&&(state==='title'||state==='play');}
function toggleFS(){const d=document;try{
  if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);}
  else{const r=(FS_EL.requestFullscreen||FS_EL.webkitRequestFullscreen).call(FS_EL);
    const lock=()=>{try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}catch(e){}};
    if(r&&r.then)r.then(lock).catch(()=>{});else lock();}
  }catch(e){}setTimeout(fit,300);}
function hitBtn(x,y){
  if(inRect({x,y},TRECT[0]))return 'T_inv';
  let best=null,bd=1e9;for(const b of TBTN){const d=Math.hypot(x-b.x,y-b.y);if(d<b.r*1.3&&d<bd){bd=d;best=b.id;}}return best;}
const TP=new Map();
function syncTouchKeys(){const held={};for(const t of TP.values())if(t.btn)held[t.btn]=true;for(const b of TBTN.concat(TRECT))keys[b.id]=!!held[b.id];}
function toCanvas(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
function mouseButtons(e){for(const [k,bit] of [['Mouse0',1],['Mouse2',2]]){const on=!!(e.buttons&bit);if(on&&!keys[k])pressed[k]=true;keys[k]=on;}}
function onDown(e){audioInit();const c=toCanvas(e);
  if(e.pointerType==='mouse'){mouse.x=c.x;mouse.y=c.y;if(e.target===cv){mouseButtons(e);e.preventDefault();}return;}
  touchMode=true;if(e.cancelable)e.preventDefault();
  const t={btn:null,t0:performance.now(),unlatch:false,fs:false};
  if(fsShown()&&inRect(c,TRECT[1])){t.fs=true;TP.set(e.pointerId,t);return;}
  if(state==='play'){const id=hitBtn(c.x,c.y);t.btn=id;
    if(id){pressed[id]=true;if(id==='T_aim'&&G&&G.aimLatch){G.aimLatch=false;t.unlatch=true;}
      if(id!=='T_aim')for(const o of TP.values())if(o.btn==='T_aim')o.used=true;}
    TP.set(e.pointerId,t);syncTouchKeys();}
  else{mouse.x=c.x;mouse.y=c.y;pressed.Mouse0=true;TP.set(e.pointerId,t);}}
function onMove(e){const c=toCanvas(e);
  if(e.pointerType==='mouse'){mouse.x=c.x;mouse.y=c.y;mouseButtons(e);return;}
  const t=TP.get(e.pointerId);if(!t)return;if(e.cancelable)e.preventDefault();
  if(state!=='play'||t.fs)return;
  // 允許手指在左右鍵之間滑動
  if(t.btn===null||t.btn==='T_left'||t.btn==='T_right'){const id=hitBtn(c.x,c.y);
    const nb=(id==='T_left'||id==='T_right')?id:null;
    if(nb!==t.btn){if(nb)pressed[nb]=true;t.btn=nb;syncTouchKeys();}}}
function onUp(e,cancel){audioInit();const c=toCanvas(e);
  if(e.pointerType==='mouse'){mouseButtons(e);return;}
  const t=TP.get(e.pointerId);TP.delete(e.pointerId);
  if(t&&!cancel){if(t.fs&&inRect(c,TRECT[1]))toggleFS();
    if(t.btn==='T_aim'&&!t.unlatch&&!t.used&&G&&state==='play'&&performance.now()-t.t0<260)G.aimLatch=true;}
  syncTouchKeys();}
addEventListener('pointerdown',onDown,{passive:false});
addEventListener('pointermove',onMove,{passive:false});
addEventListener('pointerup',e=>onUp(e,false),{passive:false});
addEventListener('pointercancel',e=>onUp(e,true),{passive:false});
// 禁止捲動、縮放、雙擊放大、長按選單
const stop=e=>{if(e.cancelable)e.preventDefault();};
document.addEventListener('touchstart',stop,{passive:false});
document.addEventListener('touchmove',stop,{passive:false});
// 保險：所有手指都離開螢幕時，清掉殘留的觸控狀態（避免按鈕卡住）
function touchReconcile(e){if(e.touches&&e.touches.length===0&&TP.size){TP.clear();syncTouchKeys();}}
document.addEventListener('touchend',e=>{audioInit();stop(e);setTimeout(()=>touchReconcile(e),0);},{passive:false});
document.addEventListener('touchcancel',e=>{setTimeout(()=>touchReconcile(e),0);},{passive:false});
['gesturestart','gesturechange','gestureend','dblclick','contextmenu','selectstart'].forEach(n=>document.addEventListener(n,stop,{passive:false}));
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;TP.clear();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){for(const k in keys)keys[k]=false;TP.clear();}else audioInit();});
const P=(...c)=>c.some(k=>pressed[k]);
const D=(...c)=>c.some(k=>keys[k]);

const NZ=[];for(let k=0;k<4;k++){const c=mk(256,256),g=c.getContext('2d'),d=g.createImageData(256,256);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}g.putImageData(d,0,0);NZ.push(ctx.createPattern(c,'repeat'));}
const VG=mk(W,H);{const g=VG.getContext('2d');const gr=g.createRadialGradient(W/2,H/2,H*0.32,W/2,H/2,H*0.98);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,0.9)');g.fillStyle=gr;g.fillRect(0,0,W,H);g.fillStyle='rgba(0,0,0,0.07)';for(let y=0;y<H;y+=3)g.fillRect(0,y,W,1);}
const LC=mk(W,H),lg=LC.getContext('2d');

// ================== 遊戲狀態 ==================
let state='title',stateT=0,G=null,gT=0;
function mon(x,s){s=s||1;return {x,home:x,hp:4,face:-1,t:Math.random()*10,alert:false,stagger:0,dead:false,deadT:0,spd:36*s,groanT:2+Math.random()*4,flash:0,hitCd:0};}
function newGame(){
  G={room:'street',cam:0,
    p:{x:190,face:1,hp:100,clip:6,aim:false,reload:0,invuln:0,kx:0,vx:0,walk:0,stepT:0,recoil:0,fireCd:0},
    inv:[{id:'ammo',n:4},null,null,null,null,null],
    rs:{street:{pick:[{x:1760,id:'ammo',n:5}],mons:[mon(2050)],gateOpen:false},
        diner:{pick:[{x:850,id:'note',n:1},{x:1390,id:'med',n:1}],mons:[mon(1060)]},
        motel:{pick:[{x:740,id:'ammo',n:6}],mons:[mon(920,1.05)]},
        alley:{pick:[{x:950,id:'ammo',n:4},{x:1660,id:'med',n:1}],mons:[mon(1150),mon(1560,1.15)]}},
    flags:{},msg:'',msgT:0,roomT:3.5,flash:0,shake:0,trans:null,invSel:0,time:0,hurtT:0,parts:[],kills:0,shots:0,
    read:null,kp:null,flk:1,flkT:0,target:null,tracer:null};
}
function msg(t,d){G.msg=t;G.msgT=d||3;}
function countItem(id){return G.inv.reduce((s,it)=>s+(it&&it.id===id?it.n:0),0);}
function addItem(id,n){const st=ITEMS[id].stack;
  for(const it of G.inv){if(it&&it.id===id&&it.n<st){const a=Math.min(n,st-it.n);it.n+=a;n-=a;if(!n)return 0;}}
  for(let i=0;i<G.inv.length;i++){if(!G.inv[i]){const a=Math.min(n,st);G.inv[i]={id,n:a};n-=a;if(!n)return 0;}}
  return n;}
function takeItem(id,n){for(let i=G.inv.length-1;i>=0&&n>0;i--){const it=G.inv[i];if(it&&it.id===id){const a=Math.min(n,it.n);it.n-=a;n-=a;if(!it.n)G.inv[i]=null;}}return n;}
function openRead(title,text,onClose){G.read={title,text,onClose};state='read';}

function targets(){const R=ROOMS[G.room],RS=G.rs[G.room],p=G.p,list=[];
  RS.pick.forEach(pk=>list.push({x:pk.x,kind:'pick',ref:pk,label:'拾取 '+ITEMS[pk.id].name+(pk.n>1?' ×'+pk.n:''),pri:0}));
  R.inter.forEach(it=>list.push({x:it.x,kind:'inter',ref:it,label:it.label||'調查',pri:1}));
  R.doors.forEach(d=>{let label=d.label;if(d.lock==='gate')label=RS.gateOpen?'進入 後巷':'後巷鐵門（上鎖）';list.push({x:d.x,kind:'door',ref:d,label,pri:2});});
  let best=null,bd=1e9;for(const t of list){const ad=Math.abs(t.x-p.x);if(ad<48){const d=ad+t.pri*8;if(d<bd){bd=d;best=t;}}}
  return best;}
function interact(t){const RS=G.rs[G.room];
  if(t.kind==='pick'){const pk=t.ref,it=ITEMS[pk.id],left=addItem(pk.id,pk.n);
    if(left===pk.n){msg('背包滿了。按 Tab 打開背包，用 X 丟掉不需要的東西。',3.5);SFX.bad();return;}
    const got=pk.n-left;SFX.pick();
    if(left>0){pk.n=left;msg('拾取了 '+it.name+' ×'+got+'（背包放不下其餘的）');}
    else{RS.pick.splice(RS.pick.indexOf(pk),1);msg('拾取了 '+it.name+(got>1?' ×'+got:''));}
    if(pk.id==='note'&&!G.flags.readNote){G.flags.readNote=true;openRead('莉拉的字條',NOTE_TEXT);}
    if(pk.id==='key')msg('拿到了「後巷鐵門鑰匙」。',3);
    return;}
  if(t.kind==='inter'){const it=t.ref;
    if(it.act==='keypad'){if(G.flags.safeOpen){openRead('保險箱','保險箱的門開著，裡面已經空了。');return;}
      G.kp={code:'',err:0};state='keypad';SFX.beep();return;}
    if(it.act==='jukebox'){SFX.melody();openRead(it.title,it.text);return;}
    if(it.act==='ending'){SFX.bell();openRead('吉他盒',ENDING_TEXT,()=>{state='end';stateT=0;SFX.sting();});return;}
    openRead(it.title,it.text);return;}
  if(t.kind==='door'){const d=t.ref;
    if(d.lock==='gate'&&!RS.gateOpen){
      if(countItem('key')){takeItem('key',1);RS.gateOpen=true;SFX.unlock();msg('鑰匙轉動了……鏽死的掛鎖「喀」地一聲彈開。後巷鐵門打開了。',4);}
      else{SFX.locked();msg('鐵門被一把粗大的掛鎖鎖住了。需要鑰匙。',3);}
      return;}
    SFX.door();G.trans={t:0,to:d.to,td:d.td,sw:false};}
}
function fire(){const p=G.p,RS=G.rs[G.room];p.clip--;p.fireCd=0.5;p.recoil=1;G.flash=1;G.shake=7;G.shots++;SFX.shot();
  let best=null,bd=1e9;for(const m of RS.mons){if(m.dead)continue;const d=(m.x-p.x)*p.face;if(d>-12&&d<650&&d<bd){bd=d;best=m;}}
  for(const m of RS.mons)if(!m.dead)m.alert=true;
  const mx=p.x+p.face*44;
  if(best){best.hp--;best.stagger=0.55;best.flash=0.12;best.x+=p.face*18;blood(best.x,FLOOR-62,p.face);
    if(best.hp<=0){best.dead=true;best.deadT=0;G.kills++;SFX.groan();}else SFX.hit();
    G.tracer={x1:mx,x2:best.x,t:0.06};}
  else G.tracer={x1:mx,x2:p.x+p.face*700,t:0.06};}
function blood(x,y,f){for(let i=0;i<14;i++)G.parts.push({x,y,vx:f*(40+Math.random()*160),vy:-60-Math.random()*120,life:0.5+Math.random()*0.6});}
function lampUpdate(l,dt){if(l.off>0)l.off-=dt;else if(Math.random()<l.f*dt*3)l.off=0.04+Math.random()*0.25;
  l.I=l.off>0?0.12:(0.88+Math.random()*0.12);}

// ================== 更新 ==================
function update(dt){stateT+=dt;gT+=dt;
  switch(state){
  case 'title':if(P('Enter','Space','Mouse0')){audioInit();newGame();state='intro';stateT=0;}break;
  case 'intro':{const shown=Math.floor(stateT/1.4)+1;if(P('Enter','Space','Mouse0','KeyE')){if(shown<INTRO.length)stateT=INTRO.length*1.4;else{state='play';stateT=0;G.roomT=3.5;}}break;}
  case 'play':updatePlay(dt);break;
  case 'inv':updateInv();break;
  case 'read':if(P('KeyE','Enter','Escape','Space','Mouse0')){const cb=G.read&&G.read.onClose;G.read=null;state='play';if(cb)cb();}break;
  case 'keypad':updateKeypad(dt);break;
  case 'dead':if(stateT>1.2&&P('Enter','Space','Mouse0')){newGame();state='play';stateT=0;}break;
  case 'end':if(stateT>2&&P('Enter','Space','Mouse0')){state='title';stateT=0;}break;
  }}
function updatePlay(dt){const p=G.p,R=ROOMS[G.room],RS=G.rs[G.room];
  G.time+=dt;G.msgT-=dt;G.roomT-=dt;G.flash=Math.max(0,G.flash-dt*9);G.shake=Math.max(0,G.shake-dt*30);G.hurtT=Math.max(0,G.hurtT-dt);
  p.recoil=Math.max(0,p.recoil-dt*6);p.fireCd-=dt;p.invuln-=dt;if(G.tracer){G.tracer.t-=dt;if(G.tracer.t<=0)G.tracer=null;}
  if(G.flkT>0){G.flkT-=dt;G.flk=0.25+Math.random()*0.55;}else{G.flk=0.95+Math.random()*0.05;if(Math.random()<dt*0.07)G.flkT=0.08+Math.random()*0.35;}
  R.lamps.forEach(l=>lampUpdate(l,dt));
  for(const q of G.parts){q.life-=dt;q.vy+=500*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.y>FLOOR+4){q.y=FLOOR+4;q.vx*=0.5;q.vy=0;}}
  G.parts=G.parts.filter(q=>q.life>0);
  if(G.trans){G.trans.t+=dt;if(!G.trans.sw&&G.trans.t>=0.35){G.trans.sw=true;G.room=G.trans.to;const d=ROOMS[G.room].doors[G.trans.td];p.x=d.x;p.kx=0;p.reload=Math.min(p.reload,0);G.roomT=3;G.parts=[];snapCam();}
    if(G.trans.t>=0.7)G.trans=null;return;}
  if(P('Tab','KeyI','T_inv')){state='inv';return;}
  p.aim=D('ShiftLeft','ShiftRight','KeyJ','Mouse2','T_aim')||!!G.aimLatch;
  const dir=(D('KeyD','ArrowRight','T_right')?1:0)-(D('KeyA','ArrowLeft','T_left')?1:0);
  if(dir)p.face=dir;
  if(keys.Mouse2)p.face=(mouse.x+G.cam>p.x)?1:-1;
  let sp=0;if(!p.aim&&dir)sp=(p.reload>0?70:145)*dir;
  p.vx=sp;p.x+=sp*dt+p.kx*dt;p.kx*=Math.pow(0.004,dt);p.x=clamp(p.x,50,R.w-50);
  if(sp){p.walk+=dt*9*Math.abs(sp)/145;p.stepT-=dt;if(p.stepT<=0){p.stepT=0.42;SFX.step();}}else p.walk*=0.8;
  if(P('KeyK','Mouse0','T_fire')){
    if(!p.aim)msg(TX('先按住 Shift／J／滑鼠右鍵 舉槍，才能射擊。','先按住「瞄準」，或輕點一下鎖定瞄準，才能開槍。'),2.5);
    else if(p.reload>0){}
    else if(p.fireCd<=0){if(p.clip<=0){SFX.empty();p.fireCd=0.25;msg(countItem('ammo')?TX('彈匣空了——按 R 裝填。','彈匣空了——點「裝填」。'):'沒有子彈了……快逃。',2);}else fire();}}
  if(P('KeyR','T_reload')&&p.reload<=0){if(p.clip>=6)msg('彈匣是滿的。',1.5);else if(!countItem('ammo'))msg('沒有備用子彈了。',2);else{p.reload=1.8;SFX.reload();}}
  if(p.reload>0){p.reload-=dt;if(p.reload<=0){const need=6-p.clip;p.clip+=need-takeItem('ammo',need);}}
  G.target=p.aim?null:targets();
  if(P('KeyE','Enter','T_use')&&G.target){interact(G.target);if(state!=='play')return;}
  // 怪物
  for(const m of RS.mons){if(m.dead){m.deadT+=dt;continue;}
    m.t+=dt;m.flash-=dt;m.hitCd-=dt;const dx=p.x-m.x,ad=Math.abs(dx);
    const lit=(m.x-p.x)*p.face>0&&ad<470;
    if(!m.alert&&(ad<360||(lit&&ad<470))){m.alert=true;SFX.groan();}
    if(m.stagger>0)m.stagger-=dt;
    else if(m.alert){m.face=dx>0?1:-1;const lurch=0.35+0.65*Math.max(0,Math.sin(m.t*3.3));if(ad>30)m.x+=m.face*m.spd*lurch*dt*1.7;}
    else{m.x+=m.face*10*dt;if(Math.abs(m.x-m.home)>90)m.face=m.x>m.home?-1:1;}
    m.x=clamp(m.x,60,R.w-60);
    m.groanT-=dt;if(m.groanT<=0){m.groanT=3+Math.random()*5;if(ad<700)SFX.groan();}
    if(ad<36&&p.invuln<=0&&m.stagger<=0){p.hp-=20;p.invuln=1.1;p.kx=(dx>=0?1:-1)*320;G.hurtT=0.7;G.shake=10;SFX.hurt();
      if(p.reload>0){p.reload=0;msg('裝填被打斷了！',1.5);}}}
  const tgt=p.x-W/2+p.face*90;G.cam+=(tgt-G.cam)*Math.min(1,dt*3);G.cam=clamp(G.cam,0,R.w-W);
  if(p.hp<=0){p.hp=0;G.aimLatch=false;state='dead';stateT=0;SFX.sting();}
}
function snapCam(){const R=ROOMS[G.room];G.cam=clamp(G.p.x-W/2+G.p.face*90,0,R.w-W);}
const INVB=[{id:'use',x:490,y:384,w:120,h:50,label:'使用'},{id:'drop',x:625,y:384,w:120,h:50,label:'丟棄'},{id:'close',x:760,y:384,w:120,h:50,label:'關閉'}];
function updateInv(){
  let act=null;
  if(P('Mouse0')){for(let i=0;i<6;i++){const cx=80+(i%3)*124,cy=130+((i/3)|0)*124;if(mouse.x>cx&&mouse.x<cx+110&&mouse.y>cy&&mouse.y<cy+110)G.invSel=i;}
    for(const b of INVB)if(mouse.x>b.x&&mouse.x<b.x+b.w&&mouse.y>b.y&&mouse.y<b.y+b.h)act=b.id;}
  if(P('Tab','KeyI','Escape')||act==='close'){state='play';return;}
  if(P('KeyD','ArrowRight'))G.invSel=(G.invSel+1)%6;
  if(P('KeyA','ArrowLeft'))G.invSel=(G.invSel+5)%6;
  if(P('KeyW','ArrowUp','KeyS','ArrowDown'))G.invSel=(G.invSel+3)%6;
  if(P('KeyE','Enter'))act='use';
  if(P('KeyX','Delete'))act='drop';
  const it=G.inv[G.invSel];if(!it||!act)return;
  if(act==='use'){
    if(it.id==='med'){if(G.p.hp>=100)msg('現在不需要。',1.5);else{G.p.hp=Math.min(100,G.p.hp+50);G.inv[G.invSel]=null;SFX.heal();msg('用了急救包。好多了。',2);}}
    else if(it.id==='note'){openRead('莉拉的字條',NOTE_TEXT);}
    else if(it.id==='key'){msg(TX('走到後巷鐵門前按 E 就會自動使用。','走到後巷鐵門前點「調查」就會自動使用。'),2.5);}
    else if(it.id==='ammo'){msg(TX('在遊戲中按 R 裝填。','在遊戲中點「裝填」。'),2);}}
  if(act==='drop'){G.rs[G.room].pick.push({x:G.p.x,id:it.id,n:it.n});G.inv[G.invSel]=null;msg('把 '+ITEMS[it.id].name+' 放在地上了。',2);}
}
function kpButtons(){const bx=W/2-115,by=210,arr=[];const labels=['1','2','3','4','5','6','7','8','9','清除','0','確認'];
  labels.forEach((l,i)=>arr.push({l,x:bx+(i%3)*80,y:by+((i/3)|0)*58,w:70,h:48}));arr.push({l:'離開',x:bx,y:by+4*58-2,w:230,h:40});return arr;}
function kpPress(l){const kp=G.kp;
  if(l==='離開'){state='play';SFX.beep();return;}
  if(l==='清除'){kp.code=kp.code.slice(0,-1);SFX.beep();return;}
  if(l==='確認'){
    if(kp.code===SAFE_CODE){G.flags.safeOpen=true;G.rs.motel.pick.push({x:1030,id:'key',n:1});SFX.unlock();state='play';msg('「嗶」——保險箱打開了。裡面有一把鑰匙。',3.5);}
    else{SFX.bad();kp.err=0.7;kp.code='';}
    return;}
  if(kp.code.length<4){kp.code+=l;SFX.beep();}}
function updateKeypad(dt){const kp=G.kp;kp.err=Math.max(0,kp.err-dt);
  if(P('Escape')){state='play';return;}
  for(let d=0;d<=9;d++)if(P('Digit'+d,'Numpad'+d))kpPress(String(d));
  if(P('Backspace'))kpPress('清除');
  if(P('Enter','NumpadEnter'))kpPress('確認');
  if(P('Mouse0'))for(const b of kpButtons())if(mouse.x>b.x&&mouse.x<b.x+b.w&&mouse.y>b.y&&mouse.y<b.y+b.h)kpPress(b.l);
}

// ================== 繪圖 ==================
function wrap(text,maxW,font){ctx.font=font;const lines=[];
  text.split('\n').forEach(par=>{if(par===''){lines.push('');return;}let line='';for(const ch of par){const t=line+ch;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=ch;}else line=t;}lines.push(line);});return lines;}
function radial(g,x,y,r0,r1,a){const gr=g.createRadialGradient(x,y,r0,x,y,r1);gr.addColorStop(0,'rgba(0,0,0,'+a+')');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r1,0,7);g.fill();}
function cone(g,x,y,ang,ha,len,c0,c1){const gr=g.createRadialGradient(x,y,6,x,y,len);gr.addColorStop(0,c0);gr.addColorStop(0.55,c1);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.moveTo(x,y);g.arc(x,y,len,ang-ha,ang+ha);g.closePath();g.fill();}
function drawPlayer(){const p=G.p;ctx.save();ctx.translate(p.x,FLOOR);ctx.scale(p.face,1);
  if(p.invuln>0&&Math.floor(p.invuln*20)%2)ctx.globalAlpha=0.55;
  const moving=Math.abs(p.vx)>1,sw=moving?Math.sin(p.walk)*0.45:0;
  ctx.strokeStyle='#1c1a18';ctx.lineWidth=8;ctx.lineCap='round';
  [[-3,sw],[3,-sw]].forEach(([lx,a])=>{ctx.beginPath();ctx.moveTo(lx,-40);ctx.lineTo(lx+Math.sin(a)*40,-40+Math.cos(a)*40);ctx.stroke();});
  ctx.fillStyle='#4e3e2e';ctx.beginPath();ctx.moveTo(-11,-75);ctx.lineTo(12,-75);ctx.lineTo(17,-25);ctx.lineTo(-16,-23);ctx.closePath();ctx.fill();
  ctx.fillStyle='#3a2e22';ctx.fillRect(-1,-74,3,48);ctx.fillRect(-13,-49,28,4);
  ctx.fillStyle='#a88a70';ctx.beginPath();ctx.arc(3,-83,7.5,0,7);ctx.fill();
  ctx.fillStyle='#2a221b';ctx.fillRect(-10,-91,25,3);ctx.fillRect(-4,-100,16,10);
  ctx.strokeStyle='#4e3e2e';ctx.lineWidth=7;
  if(p.aim){const rc=p.recoil*6,ry=-p.recoil*4;ctx.beginPath();ctx.moveTo(4,-68);ctx.lineTo(30-rc,-65+ry);ctx.stroke();
    ctx.fillStyle='#1a1a1a';ctx.fillRect(28-rc,-69+ry,15,5);ctx.fillRect(29-rc,-66+ry,4,8);ctx.fillStyle='#888';ctx.fillRect(36-rc,-72+ry,6,3);}
  else{ctx.beginPath();ctx.moveTo(4,-68);ctx.lineTo(10+sw*5,-48);ctx.lineTo(18,-56);ctx.stroke();ctx.fillStyle='#777';ctx.fillRect(17,-60,10,5);}
  ctx.restore();}
function drawMonster(m){ctx.save();ctx.translate(m.x,FLOOR);
  if(m.dead){const a=Math.min(1,m.deadT*3);ctx.fillStyle='#2e332c';ctx.beginPath();ctx.ellipse(0,-6,10+38*a,8,0,0,7);ctx.fill();
    ctx.fillStyle='#3a0c0c';ctx.beginPath();ctx.ellipse(8,1,30*a,4,0,0,7);ctx.fill();ctx.restore();return;}
  ctx.scale(m.face,1);const t=m.t,sway=Math.sin(t*3.3)*0.12,jit=m.alert?(Math.random()-0.5)*1.6:0;ctx.translate(jit,0);
  const col=m.flash>0?'#e8cfc8':'#646b5e',dk='#3a3f37';
  ctx.strokeStyle=dk;ctx.lineWidth=7;ctx.lineCap='round';const ls=Math.sin(t*3.3)*10;
  ctx.beginPath();ctx.moveTo(-4,-40);ctx.lineTo(-8+ls,0);ctx.moveTo(4,-40);ctx.lineTo(6-ls,0);ctx.stroke();
  ctx.save();ctx.translate(0,-40);ctx.rotate(0.45+sway+(m.stagger>0?-0.3:0));
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-11,0);ctx.quadraticCurveTo(-17,-30,-6,-52);ctx.lineTo(12,-50);ctx.quadraticCurveTo(15,-25,10,0);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(30,15,15,0.55)';ctx.fillRect(-4,-36,11,3);ctx.fillRect(-4,-29,12,3);ctx.fillRect(-3,-22,10,3);ctx.fillRect(-9,-12,6,8);
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(8,-59,8,10,0.6,0,7);ctx.fill();
  ctx.fillStyle='#0b0b0b';ctx.beginPath();ctx.ellipse(13,-55,3,5,0.4,0,7);ctx.fill();
  ctx.strokeStyle=col;ctx.lineWidth=5;const as=Math.sin(t*3.3+1)*0.3;
  ctx.beginPath();ctx.moveTo(8,-46);ctx.lineTo(24,-24+as*10);ctx.lineTo(34,-4+as*8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(2,-44);ctx.lineTo(13,-16);ctx.lineTo(18,6);ctx.stroke();
